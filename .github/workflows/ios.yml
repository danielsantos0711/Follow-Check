name: iOS

on:
  push:
    branches: ['claude/**', main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/validate-package.sh

  app:
    needs: engine
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Native unit checks
        run: python3 tests/native-2.5.9/native-relations.py
      - name: Build for simulator (Debug)
        run: |
          mkdir -p build
          xcodebuild -project FollowCheckIOS.xcodeproj -scheme FollowCheckIOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tee build/sim.log | grep -E "error:|warning:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0
      - name: Capture screens
        run: scripts/capture-screens.sh build/sim/Build/Products/Debug-iphonesimulator/FollowCheck.app screens
      - name: Build unsigned IPA (Release)
        run: scripts/build-unsigned-ipa.sh
      - name: Publish screens and IPA to the ci-output branch
        if: always()
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          out=$(mktemp -d)
          mkdir -p "$out/screens"
          for f in screens/*.png; do [ -f "$f" ] && sips -s format jpeg -s formatOptions 80 -Z 1400 "$f" --out "$out/screens/$(basename "${f%.png}").jpg" >/dev/null || true; done
          [ -f FollowCheck-iOS-unsigned.ipa ] && cp FollowCheck-iOS-unsigned.ipa "$out/" || true
          [ -f build/sim.log ] && grep -E "error:|warning:" build/sim.log | head -200 > "$out/build-diagnostics.txt" || true
          printf 'commit %s\nbranch %s\nbuilt %s\n' "$SHA" "$REF" "$(date -u +%FT%TZ)" > "$out/BUILD.txt"
          cd "$out"
          git init -q -b ci-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "CI output for $SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output
